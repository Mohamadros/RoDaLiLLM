[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rodali-llm-attacker"
version = "0.1.0"
description = "LLM product matcher and conservative adversarial record transformations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RoDaLi Attacker C" }]
dependencies = ["python-dotenv>=1.0"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/rodali_attacker"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

